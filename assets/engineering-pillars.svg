<svg xmlns="http://www.w3.org/2000/svg" width="860" height="142" viewBox="0 0 860 142" font-family="'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"><style>
          .p-card { transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
          .p-card:hover { filter: drop-shadow(0 0 12px rgba(230, 57, 70, 0.45)); stroke: #ff4d6d; }
        </style><rect width="860" height="142" rx="12" fill="#0c090e"/><rect x="0.5" y="0.5" width="859" height="141" rx="12" fill="none" stroke="#2a1218" stroke-width="1"/>
  <!-- Pillar Card 1 -->
  <g class="p-card" transform="translate(18, 14)">
    <rect width="264" height="114" rx="10" fill="#13090e" stroke="#541b25" stroke-width="1"/>
    
    <!-- Badge Icon -->
    <rect x="14" y="14" width="30" height="30" rx="8" fill="#2e0f16" stroke="#521b25" stroke-width="1"/>
    <text x="29" y="34" fill="#ff4d6d" font-size="16" font-weight="700" text-anchor="middle">+</text>
    
    <!-- Title & Tech Tags -->
    <text x="54" y="27" fill="#ffffff" font-size="13" font-weight="700">Agentic &amp; AI Systems</text>
    <text x="54" y="41" fill="#ff758f" font-size="9" font-weight="700" letter-spacing="0.5">PYTORCH &#183; MULTI-AGENT &#183; LLMS</text>
    
    <!-- Description -->
    <text x="14" y="70" fill="#94a3b8" font-size="10.5" font-weight="400">
      <tspan x="14" dy="0">Designing autonomous agent loops, prompt contracts,</tspan>
      <tspan x="14" dy="16">and scalable model inference pipelines.</tspan>
    </text>
  </g>
  <!-- Pillar Card 2 -->
  <g class="p-card" transform="translate(299, 14)">
    <rect width="264" height="114" rx="10" fill="#13090e" stroke="#541b25" stroke-width="1"/>
    
    <!-- Badge Icon -->
    <rect x="14" y="14" width="30" height="30" rx="8" fill="#2e0f16" stroke="#521b25" stroke-width="1"/>
    <text x="29" y="34" fill="#ff4d6d" font-size="16" font-weight="700" text-anchor="middle">&#10003;</text>
    
    <!-- Title & Tech Tags -->
    <text x="54" y="27" fill="#ffffff" font-size="13" font-weight="700">High-Performance APIs</text>
    <text x="54" y="41" fill="#ff758f" font-size="9" font-weight="700" letter-spacing="0.5">FASTAPI &#183; ASYNC &#183; NODE.JS</text>
    
    <!-- Description -->
    <text x="14" y="70" fill="#94a3b8" font-size="10.5" font-weight="400">
      <tspan x="14" dy="0">Architecting low-latency asynchronous APIs,</tspan>
      <tspan x="14" dy="16">resilient microservices, and event queues.</tspan>
    </text>
  </g>
  <!-- Pillar Card 3 -->
  <g class="p-card" transform="translate(580, 14)">
    <rect width="264" height="114" rx="10" fill="#13090e" stroke="#541b25" stroke-width="1"/>
    
    <!-- Badge Icon -->
    <rect x="14" y="14" width="30" height="30" rx="8" fill="#2e0f16" stroke="#521b25" stroke-width="1"/>
    <text x="29" y="34" fill="#ff4d6d" font-size="16" font-weight="700" text-anchor="middle">&#9881;</text>
    
    <!-- Title & Tech Tags -->
    <text x="54" y="27" fill="#ffffff" font-size="13" font-weight="700">Vision &amp; Edge Systems</text>
    <text x="54" y="41" fill="#ff758f" font-size="9" font-weight="700" letter-spacing="0.5">OPENCV &#183; TELEMETRY &#183; IOT</text>
    
    <!-- Description -->
    <text x="14" y="70" fill="#94a3b8" font-size="10.5" font-weight="400">
      <tspan x="14" dy="0">Building real-time defect segmentation models,</tspan>
      <tspan x="14" dy="16">sensor telemetry, and predictive maintenance.</tspan>
