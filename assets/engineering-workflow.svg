<svg xmlns="http://www.w3.org/2000/svg" width="860" height="130" viewBox="0 0 860 130" font-family="'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"><style>
          .wf-box { transition: all 0.25s ease; }
          .wf-box:hover { filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.4)); stroke-width: 1.5; }
        </style><rect width="860" height="130" rx="12" fill="#0d1117"/><rect x="0.5" y="0.5" width="859" height="129" rx="12" fill="none" stroke="#30363d" stroke-width="1"/><text x="24" y="28" fill="#ffffff" font-size="14.5" font-weight="700">How I approach engineering work</text><text x="24" y="46" fill="#94a3b8" font-size="11">A systematic loop for reliable, maintainable software &amp; AI architectures</text>
  <!-- Step 1 -->
  <g class="wf-box" transform="translate(24, 62)">
    <rect width="175" height="46" rx="8" fill="#1e1b4b" stroke="#4338ca" stroke-width="1"/>
    <text x="12" y="18" fill="#818cf8" font-size="8.5" font-weight="700" letter-spacing="0.5">01 / CLARIFY</text>
    <text x="12" y="34" fill="#ffffff" font-size="10.5" font-weight="600">Understand the problem</text>
  </g>
  <g transform="translate(209, 82)">
    <line x1="0" y1="0" x2="16" y2="0" stroke="#38bdf8" stroke-width="1.4" stroke-opacity="0.6"/>
    <polyline points="12,-4 16,0 12,4" fill="none" stroke="#38bdf8" stroke-width="1.4" stroke-opacity="0.6"/>
    <circle r="1.8" fill="#ffffff">
      <animateMotion path="M 0 0 L 16 0" dur="1.2s" begin="0.0s" repeatCount="indefinite"/>
    </circle>
  </g>
  <!-- Step 2 -->
  <g class="wf-box" transform="translate(235, 62)">
    <rect width="175" height="46" rx="8" fill="#0c2d48" stroke="#0284c7" stroke-width="1"/>
    <text x="12" y="18" fill="#38bdf8" font-size="8.5" font-weight="700" letter-spacing="0.5">02 / ARCHITECT</text>
    <text x="12" y="34" fill="#ffffff" font-size="10.5" font-weight="600">Model decoupled solutions</text>
  </g>
  <g transform="translate(420, 82)">
    <line x1="0" y1="0" x2="16" y2="0" stroke="#38bdf8" stroke-width="1.4" stroke-opacity="0.6"/>
    <polyline points="12,-4 16,0 12,4" fill="none" stroke="#38bdf8" stroke-width="1.4" stroke-opacity="0.6"/>
    <circle r="1.8" fill="#ffffff">
      <animateMotion path="M 0 0 L 16 0" dur="1.2s" begin="0.25s" repeatCount="indefinite"/>
    </circle>
  </g>
  <!-- Step 3 -->
  <g class="wf-box" transform="translate(446, 62)">
    <rect width="175" height="46" rx="8" fill="#064e3b" stroke="#059669" stroke-width="1"/>
    <text x="12" y="18" fill="#10b981" font-size="8.5" font-weight="700" letter-spacing="0.5">03 / BENCHMARK</text>
    <text x="12" y="34" fill="#ffffff" font-size="10.5" font-weight="600">Test edges &amp; latency</text>
  </g>
  <g transform="translate(631, 82)">
    <line x1="0" y1="0" x2="16" y2="0" stroke="#38bdf8" stroke-width="1.4" stroke-opacity="0.6"/>
    <polyline points="12,-4 16,0 12,4" fill="none" stroke="#38bdf8" stroke-width="1.4" stroke-opacity="0.6"/>
    <circle r="1.8" fill="#ffffff">
      <animateMotion path="M 0 0 L 16 0" dur="1.2s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  <!-- Step 4 -->
  <g class="wf-box" transform="translate(657, 62)">
    <rect width="175" height="46" rx="8" fill="#451a03" stroke="#d97706" stroke-width="1"/>
    <text x="12" y="18" fill="#f59e0b" font-size="8.5" font-weight="700" letter-spacing="0.5">04 / SHIP &amp; LOG</text>
    <text x="12" y="34" fill="#ffffff" font-size="10.5" font-weight="600">Deploy with telemetry</text>
  </g></svg>